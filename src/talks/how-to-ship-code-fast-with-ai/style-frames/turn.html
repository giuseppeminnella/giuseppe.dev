<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn workbench</title>
<link rel="stylesheet" href="scene.css">
</head>
<body>
<header>
  <b>Turn · from the cartoon to the white</b>
  <button id="prev">&larr;</button>
  <span id="stepname"></span>
  <button id="next">&rarr;</button>
  <button id="replay">Replay step</button>
  <label><input type="checkbox" id="sight"> sightline</label>
</header>
<div id="wrap"><div id="stage"><div class="frame">
  <svg id="art" viewBox="0 0 1920 1080"></svg>
  <div class="sight"></div>
</div></div></div>

<script src="lib.js"></script>
<script>
// Straight after the cartoon: a white beat, then one plain line. The marker under "drift" is the first time
// the audience sees yellow, and from here on yellow means drift.
const STEPS = 2;
const LINE = 'That was drift.', MARK = 'drift';
const T = { mkop: 60, ink: 20, soft: 175 };
const lin = t => t;
const q = new URLSearchParams(location.search);
let step = Math.min(STEPS, Math.max(1, +(q.get('step') || 1)));
const prog = (ms, delay, dur) => clamp((ms - delay) / dur);
const at_ = (on, ms, delay, dur, fn = ease) => step < on ? 0 : step > on ? 1 : fn(prog(ms, delay, dur));

const svg = document.getElementById('art');
let parts = {};

function build() {
  svg.innerHTML = '';
  // the line in a light grey; only the marked word is black
  const t = el('text', { x: 0, y: 290, 'font-size': 60, 'font-weight': 600, fill: grey(T.soft), 'letter-spacing': -1 }, svg);
  const i = LINE.indexOf(MARK);
  el('tspan', {}, t).textContent = LINE.slice(0, i);
  el('tspan', { fill: grey(T.ink), 'font-weight': 700 }, t).textContent = MARK;
  el('tspan', {}, t).textContent = LINE.slice(i + MARK.length);
  t.setAttribute('x', 960 - t.getComputedTextLength() / 2);   // centred
  // the marker under the word, a hand-made swipe revealed left to right
  const x = +t.getAttribute('x'), size = 60, y = 290 - size * .34;
  const x0 = x + t.getSubStringLength(0, i), x1 = x0 + t.getSubStringLength(i, MARK.length);
  const guide = el('path', { d: `M${x0 + size * .2} ${y} L${x1 - size * .1} ${y}`, fill: 'none', stroke: 'none' }, svg);
  const mask = el('mask', { id: 'reveal', maskUnits: 'userSpaceOnUse', x: -1e4, y: -1e4, width: 2e4, height: 2e4 }, svg);
  parts.rect = el('rect', { x: x0 - 60, y: y - 120, height: 240, width: 0, fill: '#fff' }, mask);
  parts.span = x1 - x0 + 120;
  const mk = el('g', { class: 'mk', mask: 'url(#reveal)' }, svg);
  markerPolygons(guide, { width: size * .82, jitter: 4, seed: 7 }).forEach(pts => el('polygon', { points: pts, fill: 'var(--hl)', 'fill-opacity': T.mkop / 100 }, mk));
  parts.text = t;
}

function frame(ms) {
  // step 1 is the white beat: nothing at all
  parts.text.setAttribute('opacity', at_(2, ms, 200, 700, lin));
  parts.rect.setAttribute('width', parts.span * at_(2, ms, 1300, 600, swipe));
  document.getElementById('stepname').textContent = `step ${step} of ${STEPS} · ${['white', 'that was drift'][step - 1]}`;
}

// ---------- playback ----------
const DUR = { 1: 400, 2: 2000 };
const BACK_SPEED = 1.5;
let raf = 0, anim = null;
function run(dir) {
  cancelAnimationFrame(raf);
  const dur = DUR[step], speed = dir > 0 ? 1 : BACK_SPEED, start = performance.now();
  anim = { dir };
  const tick = now => {
    const e = (now - start) * speed;
    if (e >= dur) return finish();
    frame(dir > 0 ? e : dur - e);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function finish() {
  cancelAnimationFrame(raf);
  if (anim && anim.dir < 0) step -= 1;
  anim = null;
  frame(1e9);
}
function next() { if (anim) return finish(); if (step === STEPS) return; step += 1; run(1); }
function prev() { if (anim) return finish(); if (step === 1) return; run(-1); }
function play() { cancelAnimationFrame(raf); anim = null; run(1); }

build();
</script>
<script src="scene.js"></script>
</body>
</html>
