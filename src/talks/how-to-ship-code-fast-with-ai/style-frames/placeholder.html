<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placeholder</title>
<link rel="stylesheet" href="scene.css">
<style>
  .card { position: absolute; left: 150px; top: 96px; width: 1620px; margin: 0; }
  .card .kicker { font-size: 34px; font-weight: 500; color: rgb(153,153,153); margin: 0 0 18px; }
  .card h1 { font-size: 104px; line-height: 1.02; font-weight: 700; letter-spacing: -.032em; color: #111; margin: 0 0 36px; }
  .card ol { margin: 0; padding: 0 0 0 1.2em; font-size: 30px; line-height: 1.5; font-weight: 600; color: rgb(150,150,150); }
  .card ol li::marker { color: rgb(200,200,200); }
</style>
</head>
<body>
<header>
  <b>Placeholder</b>
  <button id="prev">&larr;</button>
  <span id="stepname"></span>
  <button id="next">&rarr;</button>
  <button id="replay">Replay step</button>
</header>
<div id="wrap"><div id="stage"><div class="frame">
  <div class="card">
    <p class="kicker">to build</p>
    <h1 id="title"></h1>
    <ol id="beats"></ol>
  </div>
</div></div></div>
<script src="lib.js"></script>
<script>
// A section we have not built yet: its title and the beats it has to carry. ?title=...&beats=one|two|three
const STEPS = 1;
const q = new URLSearchParams(location.search);
document.getElementById('title').textContent = q.get('title') || 'To build';
(q.get('beats') || '').split('|').filter(Boolean).forEach(b => { const li = document.createElement('li'); li.textContent = b; document.getElementById('beats').appendChild(li); });
let step = 1, anim = null;
function frame() { document.getElementById('stepname').textContent = 'one card'; }
function run() { frame(); }
function finish() {}
function next() {}
function prev() {}
function play() { frame(); }
</script>
<script src="scene.js"></script>
</body>
</html>
