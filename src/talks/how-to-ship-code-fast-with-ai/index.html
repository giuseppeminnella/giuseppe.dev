<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to ship code fast with AI</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: #fff; opacity: 0; transition: opacity .35s ease; }
  iframe.on { opacity: 1; }
  #catch { position: fixed; inset: 0; z-index: 5; cursor: pointer; }
  #clock { position: fixed; left: 16px; bottom: 12px; z-index: 6; font: 600 15px ui-monospace, Menlo, monospace; color: #bbb; font-variant-numeric: tabular-nums; }
  #clock.warn { color: #E0A21B; }
  #clock.over { color: #D8483A; }
  #where { position: fixed; right: 16px; bottom: 12px; z-index: 6; font: 600 15px -apple-system, Helvetica, sans-serif; color: #bbb; display: none; }
  body.info #where { display: block; }
  #chapters { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .4s ease; }
  #chapters.on { opacity: 1; }
  #chapters svg { width: 100%; height: 100%; display: block; }
  #chapters text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Helvetica, sans-serif; font-weight: 600; }
</style>
</head>
<body>
<div id="catch"></div>
<div id="clock">00:00</div>
<div id="where"></div>
<div id="chapters"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg></div>
<script>
// The running order. Each scene is a page that plays its own steps; the shell owns the clicker and moves between them.
// from/to play a slice of a scene; steps is a whole scene's step count. Reorder here to move a section.
// chapters: the step where each chapter of the timeline starts; a chapter runs on until the next one, across scenes.
// "Chapter · part" splits a chapter into parts, with a smaller gap between them. timeline: false keeps a scene off the timeline (the hook).
const SCENES = [
  { name: 'intro: a day at the BTC', src: 'intro/index.html', end: 'slide=13&lt=1.4' },
  { name: 'the turn: you just watched me drift', src: 'style-frames/turn.html', steps: 2, timeline: false },
  { name: 'drift, the team, everywhere', src: 'style-frames/b.html', from: 1, to: 5, chapters: { 1: 'Drift happens everywhere' } },
  { name: 'the loop', src: 'style-frames/loop.html', steps: 3 },
  { name: 'with AI, when to go fast, the morning after', src: 'style-frames/b.html', from: 6, to: 13, chapters: { 6: 'With AI', 11: 'When to go fast' } },
  { name: 'slowing down, the time, the pipeline', src: 'style-frames/c.html', steps: 10, chapters: { 1: 'Slowing down', 4: 'Where the time goes' } },
  { name: 'silos', src: 'style-frames/silos.html', steps: 3, chapters: { 1: 'Silos' } },
  { name: 'solutions: practice, tooling', src: 'style-frames/solutions.html', from: 1, to: 7, chapters: { 1: 'Solutions · practice', 4: 'Solutions · tooling' } },
  { name: 'focus: the cone of attention', src: 'style-frames/focus.html', steps: 3, chapters: { 1: 'Solutions · people' } },
  { name: 'solutions: people', src: 'style-frames/solutions.html', from: 8, to: 9 },
  { name: 'close: harmonise every step, the software factory', src: 'style-frames/close.html', steps: 12, chapters: { 1: 'Harmonise every step', 6: 'The software factory', 10: 'Close' } },
];
// The chapter timeline: on for rehearsal. Set this to false for the final talk; ?chapters=0|1 overrides it, T toggles it live.
const SHOW_CHAPTERS = true;

const q = new URLSearchParams(location.search);
let cur = Math.min(SCENES.length - 1, Math.max(0, (+q.get('scene') || 1) - 1));
let live = null, pending = null, busy = false, startedAt = null;

function urlFor(i, enter) {
  const s = SCENES[i], p = new URLSearchParams();
  p.set('embed', '');
  if (s.end) return s.src + '?embed' + (enter === 'end' ? '&' + s.end : '');
  p.set('enter', enter);
  if (s.from) p.set('from', s.from);
  if (s.to) p.set('to', s.to);
  if (s.title) p.set('title', s.title);
  if (s.beats) p.set('beats', s.beats.join('|'));
  return s.src + '?' + p.toString().replace('embed=&', 'embed&');
}

function open(i, enter) {
  busy = true;
  const f = document.createElement('iframe');
  f.dataset.enter = enter;
  f.src = urlFor(i, enter);
  document.body.insertBefore(f, document.getElementById('catch'));
  pending = f;
  setTimeout(() => { if (pending === f) swap(); }, 3000);   // a scene that never says ready still gets shown
  document.getElementById('where').textContent = `${i + 1}/${SCENES.length} · ${SCENES[i].name}`;
}
function swap() {
  const f = pending, old = live;
  pending = null; live = f;
  requestAnimationFrame(() => f.classList.add('on'));
  if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 400); }
  // going forward into a scene that is not the very first: play its first step straight away
  if (f.dataset.enter === 'start' && old) { send(f, 'go'); f.dataset.started = '1'; }
  busy = false;
  send(f, 'chapters', { on: chaptersOn });
  drawTimeline();
}
const send = (f, cmd, extra) => f && f.contentWindow && f.contentWindow.postMessage({ deck: true, cmd, ...extra }, '*');

addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.deck) return;
  const from = [live, pending].find(f => f && e.source === f.contentWindow);
  if (from && m.step != null) { from._step = m.step; if (from === live) drawTimeline(); return; }
  if (pending && e.source === pending.contentWindow && m.ready) { checkSteps(cur, m); if (m.content) fitTimeline(m.content); return swap(); }
  if (!live || e.source !== live.contentWindow || busy) return;
  if (m.edge === 'end' && cur < SCENES.length - 1) { cur++; open(cur, 'start'); }
  if (m.edge === 'start' && cur > 0) { cur--; open(cur, 'end'); }
});

function next() {
  if (busy) return;
  if (startedAt === null) startedAt = performance.now();
  // opened straight onto a scene (?scene=): the first click plays its first step
  if (live && !live.dataset.started && live.dataset.enter === 'start' && !SCENES[cur].end) { live.dataset.started = '1'; return send(live, 'go'); }
  send(live, 'next');
}
function prev() { if (busy) return; send(live, 'prev'); }

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'r' || k === 'R') send(live, 'replay');
  else if (k === 'i' || k === 'I') document.body.classList.toggle('info');
  else if (k === 't' || k === 'T') { chaptersOn = !chaptersOn; send(live, 'chapters', { on: chaptersOn }); drawTimeline(); }
  else if (k === 'f' || k === 'F') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
});
document.getElementById('catch').addEventListener('click', next);

// the talk clock: starts on the first click; amber at 40 minutes, red at 44. ?web (the deck on the blog) hides it: it is the presenter's.
if (q.has('web')) document.getElementById('clock').style.display = 'none';
setInterval(() => {
  const secs = startedAt === null ? 0 : Math.floor((performance.now() - startedAt) / 1000);
  const c = document.getElementById('clock');
  c.textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
  c.classList.toggle('warn', secs >= 2400 && secs < 2640);
  c.classList.toggle('over', secs >= 2640);
}, 500);

// ---------- the chapter timeline, along the bottom ----------
// Quiet on purpose: thin segments, one per chapter, sized by their steps. Only the chapter you are in is named and
// drawn a little stronger; the others are bare segments, so nothing ahead is given away. Hidden during the intro.
let chaptersOn = q.has('chapters') ? q.get('chapters') !== '0' : SHOW_CHAPTERS;
const stepsOf = s => s.to ? s.to - (s.from || 1) + 1 : s.steps || 0;
const onTimeline = s => !s.end && s.timeline !== false;
const TL = (() => {
  const offsets = [], starts = [];
  let total = 0;
  SCENES.forEach((s, i) => {
    offsets[i] = total;
    for (const k in s.chapters || {}) starts.push({ at: total + +k - (s.from || 1), title: s.chapters[k] });
    if (onTimeline(s)) total += stepsOf(s);
  });
  starts.sort((a, b) => a.at - b.at);
  return { total, offsets, list: starts.map((c, j) => ({ ...c, end: j + 1 < starts.length ? starts[j + 1].at : total, major: c.title.split(' · ')[0] })) };
})();
function checkSteps(i, m) {   // a scene whose step count changed without this list following
  const s = SCENES[i];
  if (!s.end && m.last != null && m.last - m.first + 1 !== stepsOf(s)) console.warn(`timeline: "${s.name}" has ${m.last - m.first + 1} steps, SCENES says ${stepsOf(s)}`);
}
const TLG = { x0: 150, x1: 1770, y: 1058, w: 3, wHere: 5 };
const svgNS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const tlEl = document.getElementById('chapters'), tlSvg = tlEl.querySelector('svg'), tlG = mk('g', {}, tlSvg);
const tx = k => TLG.x0 + (TLG.x1 - TLG.x0) * k / TL.total;
const tlSegs = TL.list.map((c, j) => {
  const before = TL.list[j - 1], after = TL.list[j + 1];
  const gap = o => !o ? 0 : o.major === c.major ? 2 : 6;   // parts of one chapter sit closer together
  const a = tx(c.at) + gap(before), b = tx(c.end) - gap(after);
  return { ...c, a, b,
    base: mk('line', { x1: a, x2: b, y1: TLG.y, y2: TLG.y, 'stroke-linecap': 'butt' }, tlG),
    done: mk('line', { x1: a, x2: a, y1: TLG.y, y2: TLG.y, stroke: 'rgb(160,160,160)', 'stroke-width': TLG.wHere, 'stroke-linecap': 'butt' }, tlG) };
});
const tlDot = mk('circle', { cy: TLG.y, r: 6, fill: 'rgb(150,150,150)' }, tlG);
const tlLabel = mk('text', { y: TLG.y - 16, 'font-size': 20, fill: 'rgb(160,160,160)' }, tlG);
// the scenes draw inside a safe area (scene.js); the timeline follows the same scale, so it lines up with the notes
const fitTimeline = k => tlG.setAttribute('transform', `translate(960 540) scale(${k}) translate(-960 -540)`);
let tlShown = null, tlTarget = 0, tlRaf = 0;
function drawTimeline() {
  const s = SCENES[cur], on = chaptersOn && onTimeline(s);
  tlEl.classList.toggle('on', on);
  if (!onTimeline(s)) return;
  const n = stepsOf(s), first = s.from || 1;
  const st = live && live._step != null ? live._step : live && live.dataset.enter === 'end' ? first + n - 1 : first - 1;
  const local = Math.max(0, Math.min(n, st - first + 1));
  tlTarget = TL.offsets[cur] + Math.max(0, local - .5);   // the dot sits in the middle of the step you are on
  if (tlShown === null) tlShown = tlTarget;
  cancelAnimationFrame(tlRaf);
  const from = tlShown, t0 = performance.now();
  const tick = now => {   // glide to the new step
    const p = Math.min(1, (now - t0) / 450), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    tlShown = from + (tlTarget - from) * e;
    paintTimeline(tlShown);
    if (p < 1) tlRaf = requestAnimationFrame(tick);
  };
  tlRaf = requestAnimationFrame(tick);
}
function paintTimeline(pos) {
  const k = Math.floor(pos), here = tlSegs.find(c => k >= c.at && k < c.end) || tlSegs[tlSegs.length - 1], x = tx(pos);
  tlSegs.forEach(c => {
    const now = c === here, past = c.end <= here.at;
    c.base.setAttribute('stroke', now ? 'rgb(226,226,226)' : past ? 'rgb(212,212,212)' : 'rgb(236,236,236)');
    c.base.setAttribute('stroke-width', now ? TLG.wHere : TLG.w);
    c.done.setAttribute('x2', now ? Math.max(c.a, Math.min(c.b, x)) : c.a);
  });
  tlDot.setAttribute('cx', Math.max(here.a, Math.min(here.b, x)));
  if (tlLabel.textContent !== here.title) tlLabel.textContent = here.title;
  tlLabel.setAttribute('x', Math.max(TLG.x0, Math.min(here.a, TLG.x1 - tlLabel.getComputedTextLength())));
}

open(cur, q.get('enter') || 'start');
</script>
</body>
</html>
